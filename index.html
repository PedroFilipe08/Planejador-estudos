<!-- Cards -->

<section class="cards">

    <div class="card">

        <span>Total estudado</span>

        <h2 id="totalHoras">0h</h2>

    </div>

    <div class="card">

        <span>Meta semanal</span>

        <h2 id="metaHoras">25h</h2>

    </div>

    <div class="card">

        <span>Progresso</span>

        <h2 id="porcentagem">0%</h2>

    </div>

</section>

<!-- ==========================
POMODORO
========================== -->

<section class="pomodoro">

    <div class="pomodoroCard">

        <h2>
            🍅 Pomodoro
        </h2>

        <p id="pomodoroStatus">
            Foco
        </p>

        <div id="timer">
            25:00
        </div>

        <div class="pomodoroButtons">

            <button id="startPomodoro">

                <i class="fa-solid fa-play"></i>

                Iniciar

            </button>

            <button id="pausePomodoro">

                <i class="fa-solid fa-pause"></i>

                Pausar

            </button>

            <button id="resetPomodoro">

                <i class="fa-solid fa-rotate-left"></i>

                Reiniciar

            </button>

        </div>

    </div>

</section>

<!-- Barra -->

<section class="progress">

    <div class="progressBar">

        <div id="barra"></div>

    </div>

</section>
