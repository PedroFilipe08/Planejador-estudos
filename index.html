<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Planner</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-book-open"></i>

            <h2>Study Planner</h2>

        </div>

        <nav>

            <button class="menu active">
                <i class="fa-solid fa-chart-simple"></i>
                Dashboard
            </button>

            <button class="menu">
                <i class="fa-solid fa-book"></i>
                Matérias
            </button>

            <button class="menu">
                <i class="fa-solid fa-gear"></i>
                Configurações
            </button>

        </nav>

    </aside>

    <!-- Conteúdo -->

    <main>

        <!-- Topo -->

        <header>

            <div>

                <h1>Olá 👋</h1>
                <p>Acompanhe suas horas de estudo.</p>

            </div>

            <button id="darkMode">

                <i class="fa-solid fa-moon"></i>

            </button>

        </header>

        <!-- Cards -->

        <section class="cards">

            <div class="card">

                <span>Total estudado</span>

                <h2 id="totalHoras">0h</h2>

            </div>

            <div class="card">

                <span>Meta semanal</span>

                <h2 id="metaHoras">25h</h2>

            </div>

            <div class="card">

                <span>Progresso</span>

                <h2 id="porcentagem">0%</h2>

            </div>

        </section>

        <!-- Barra -->

        <section class="progress">

            <div class="progressBar">

                <div id="barra"></div>

            </div>

        </section>

        <!-- Cadastro -->

        <section class="novo">

            <h2>Adicionar matéria</h2>

            <div class="form">

                <input
                id="materia"
                type="text"
                placeholder="Nome da matéria">

                <input
                id="horas"
                type="number"
                placeholder="Horas">

                <button id="adicionar">

                    <i class="fa-solid fa-plus"></i>

                    Adicionar

                </button>

            </div>

        </section>

        <!-- Lista -->

        <section>

            <h2 class="tituloLista">

                Suas matérias

            </h2>

            <div id="listaMaterias">

            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
